name: Export checks (native solver never run)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test
      - run: python3 -m compileall -q python scripts/compare-native.py
      - run: bun run example --output work/ci-export --gap 0.1
      - run: test ! -f work/ci-export/electric-field.png && test ! -f work/ci-export/model.msh
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-export-native-never-run
          path: work/ci-export
